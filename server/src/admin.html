<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>MirForge 管理台</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 28px 36px; background: #0d0f18; color: #e8e2d0;
         font: 14px/1.6 "Microsoft YaHei", sans-serif; }
  h1 { font-size: 18px; letter-spacing: 6px; color: #c9a55c; font-weight: 600; }
  .cards { display: flex; gap: 14px; margin: 18px 0; flex-wrap: wrap; }
  .card { background: rgba(13,15,24,.9); border: 1px solid #2a2d3c; border-radius: 4px;
          padding: 12px 20px; min-width: 120px; }
  .card b { display: block; font-size: 22px; color: #ffd876; }
  .card span { font-size: 12px; color: #9a917c; }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; }
  th, td { text-align: left; padding: 6px 12px; border-bottom: 1px solid #1c1f2e; font-size: 13px; }
  th { color: #9a917c; font-weight: normal; }
  td .off { color: #5b5648; }
  button { background: #372d19; color: #ffd876; border: 1px solid #6b5a32; border-radius: 3px;
           padding: 5px 14px; cursor: pointer; font-family: inherit; }
  button:hover { background: #4a3c22; }
  input { background: #0e1017; color: #e8e2d0; border: 1px solid #2a2d3c; border-radius: 3px;
          padding: 6px 10px; font-family: inherit; width: 320px; }
  .row { display: flex; gap: 10px; align-items: center; margin: 16px 0; }
  #msg { color: #7bd88f; font-size: 12px; }
  .tabs { display: flex; gap: 4px; margin-top: 22px; border-bottom: 1px solid #2a2d3c; }
  .tabs button { border-radius: 3px 3px 0 0; border-bottom: none; background: #171a26; color: #9a917c; }
  .tabs button.on { background: #372d19; color: #ffd876; }
  .pane { display: none; padding-top: 12px; }
  .pane.on { display: block; }
  textarea { width: 100%; min-height: 320px; background: #0e1017; color: #cfc8b4;
             border: 1px solid #2a2d3c; border-radius: 3px; padding: 10px;
             font: 12px/1.5 Consolas, monospace; box-sizing: border-box; }
  td input { width: 70px; padding: 3px 6px; }
  td input.wide { width: 110px; }
  td input[type=checkbox] { width: auto; }
  td select { background: #0e1017; color: #e8e2d0; border: 1px solid #2a2d3c;
              border-radius: 3px; padding: 3px 6px; }
  td input:disabled { opacity: .3; }
  #cfg-err { color: #e04040; font-size: 12px; white-space: pre-line; }
  td img.icon { width: 32px; height: 32px; object-fit: contain; vertical-align: middle;
                background: #0e1017; border: 1px solid #2a2d3c; border-radius: 3px; cursor: pointer; }
  #picker { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 10; }
  #picker.on { display: flex; align-items: center; justify-content: center; }
  #picker .box { background: #0d0f18; border: 1px solid #6b5a32; border-radius: 4px;
                 padding: 16px; max-height: 80vh; overflow: auto; }
  #picker img { image-rendering: pixelated; cursor: crosshair; display: block; }
</style>
</head>
<body>
<h1>MIRFORGE 管理台</h1>
<div class="tabs">
  <button id="tab-status" class="on" onclick="showTab('status')">状态</button>
  <button id="tab-config" onclick="showTab('config')">配置</button>
</div>
<div id="pane-status" class="pane on">
<div class="cards">
  <div class="card"><b id="c-uptime">-</b><span>运行时长</span></div>
  <div class="card"><b id="c-players">-</b><span>在线玩家</span></div>
  <div class="card"><b id="c-monsters">-</b><span>怪物 存活/总数</span></div>
  <div class="card"><b id="c-ground">-</b><span>地面物品</span></div>
  <div class="card"><b id="c-zones">-</b><span>区域</span></div>
</div>
<div class="row">
  <input id="bc" placeholder="全服公告内容…">
  <button onclick="broadcastMsg()">发送公告</button>
  <button onclick="saveAll()">立即存档</button>
  <span id="msg"></span>
</div>
<table>
  <thead><tr><th>角色</th><th>等级</th><th>区域</th><th>坐标</th><th>HP</th><th>状态</th><th></th></tr></thead>
  <tbody id="rows"></tbody>
</table>
</div>

<div id="pane-config" class="pane">
  <div class="row">
    <button onclick="loadCfg()">重新载入</button>
    <button onclick="saveCfg('items')">保存物品</button>
    <button onclick="saveCfg('skills')">保存技能</button>
    <button onclick="saveCfg('quests')">保存任务</button>
    <span style="color:#9a917c;font-size:12px">保存 = 校验 → 写回 server/data/*.json → 热重载 (在线玩家立即生效)</span>
  </div>
  <div id="cfg-err"></div>
  <h3 style="color:#c9a55c;font-size:14px">物品 items.json</h3>
  <table id="item-table">
    <thead><tr><th>template</th><th>名称</th><th>槽位</th><th>攻击</th><th>防御</th><th>HP</th><th>图标帧</th><th>外观</th><th></th></tr></thead>
    <tbody></tbody>
  </table>
  <div class="row"><button onclick="addItemRow()">+ 新增物品</button></div>
  <h3 style="color:#c9a55c;font-size:14px">技能 skills.json</h3>
  <table id="skill-table">
    <thead><tr><th>职业</th><th>id</th><th>名称</th><th>MP</th><th>冷却ms</th><th>等级</th><th>射程</th><th>自身</th><th>类型</th><th title="damage:伤害倍率 / aoe:半径">参数1</th><th title="aoe:伤害倍率">参数2</th><th></th></tr></thead>
    <tbody></tbody>
  </table>
  <div class="row"><button onclick="addSkillRow()">+ 新增技能</button></div>
  <h3 style="color:#c9a55c;font-size:14px">任务 quests.json</h3>
  <textarea id="quests-json" spellcheck="false"></textarea>
  <h3 style="color:#c9a55c;font-size:14px">区域 zones/*.json <span style="color:#5b5648;font-size:12px">(保存后该区怪物按新配置立即重建)</span></h3>
  <div class="row">
    <select id="zone-sel" onchange="showZone()" style="background:#0e1017;color:#e8e2d0;border:1px solid #2a2d3c;border-radius:3px;padding:6px 10px"></select>
    <button onclick="saveZone()">保存区域</button>
    <span style="color:#9a917c;font-size:12px">接入新地图:</span>
    <select id="zone-avail" style="background:#0e1017;color:#e8e2d0;border:1px solid #2a2d3c;border-radius:3px;padding:6px 10px;width:140px"></select>
    <button onclick="addZone()">接入</button>
  </div>
  <textarea id="zone-json" spellcheck="false" style="min-height:220px"></textarea>
</div>
<div id="picker" onclick="closePicker(event)">
  <div class="box">
    <div class="row" style="margin-top:0">
      <button onclick="pickerPage(-1)">上一页</button>
      <span id="picker-range" style="color:#9a917c;font-size:12px"></span>
      <button onclick="pickerPage(1)">下一页</button>
      <span style="color:#5b5648;font-size:12px">点击图标选择</span>
    </div>
    <img id="picker-img" width="480" onclick="pickIcon(event)">
  </div>
</div>
<script>
const token = localStorage.getItem('admToken') || '';
const hdr = token ? { 'x-admin-token': token } : {};
function fmtUp(s) {
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60);
  return h > 0 ? `${h}h${m}m` : `${m}m${s%60}s`;
}
async function tick() {
  try {
    const r = await fetch('/api/status', { headers: hdr });
    if (r.status === 401) { document.getElementById('msg').textContent =
      '未授权: localStorage.setItem("admToken", "<token>") 后刷新'; return; }
    const d = await r.json();
    c('c-uptime', fmtUp(d.uptime_secs));
    c('c-players', d.players.filter(p => p.connected).length);
    c('c-monsters', d.monsters_alive + '/' + d.monsters_total);
    c('c-ground', d.ground_items);
    c('c-zones', d.zones.length);
    document.getElementById('rows').innerHTML = d.players.map(p => `<tr>
      <td>${p.name}</td><td>${p.level}</td><td>${p.zone}</td>
      <td>${p.x.toFixed(1)}, ${p.y.toFixed(1)}</td><td>${p.hp}/${p.max_hp}</td>
      <td>${p.connected ? '在线' : '<span class=off>重连窗</span>'}</td>
      <td><button onclick="kick('${p.name}')">踢下线</button></td></tr>`).join('');
  } catch (e) { /* 服务器未就绪 */ }
}
function c(id, v) { document.getElementById(id).textContent = v; }
async function broadcastMsg() {
  const message = document.getElementById('bc').value.trim();
  if (!message) return;
  await fetch('/api/broadcast', { method: 'POST',
    headers: { ...hdr, 'content-type': 'application/json' },
    body: JSON.stringify({ message }) });
  document.getElementById('bc').value = '';
  flash('公告已发送');
}
async function kick(name) {
  await fetch('/api/kick', { method: 'POST',
    headers: { ...hdr, 'content-type': 'application/json' },
    body: JSON.stringify({ name }) });
  flash(name + ' 已踢下线'); tick();
}
async function saveAll() {
  await fetch('/api/save', { method: 'POST', headers: hdr });
  flash('已存档');
}
function flash(t) { const m = document.getElementById('msg');
  m.textContent = t; setTimeout(() => m.textContent = '', 2500); }
function showTab(t) {
  for (const k of ['status', 'config']) {
    document.getElementById('tab-' + k).classList.toggle('on', k === t);
    document.getElementById('pane-' + k).classList.toggle('on', k === t);
  }
  if (t === 'config') { loadCfg(); loadZones(); }
}
const ITEM_COLS = ['template','name','slot','attack','defense','hp','image','shape'];
const NUM_COLS = new Set(['attack','defense','hp','image','shape']);
function itemRow(it) {
  const tr = document.createElement('tr');
  tr.innerHTML = ITEM_COLS.map(c => {
    const inp = `<input class="${c === 'template' || c === 'name' ? 'wide' : ''}" data-c="${c}" value="${it[c] ?? (NUM_COLS.has(c) ? 0 : '')}">`;
    if (c === 'image') return `<td>${inp} <img class="icon" title="点击从图库选择" src="/api/frame/items/${it.image ?? 0}" onclick="openPicker(this)"></td>`;
    return `<td>${inp}</td>`;
  }).join('') + `<td><button onclick="this.closest('tr').remove()">删</button></td>`;
  // 手改帧号时同步预览
  tr.querySelector('input[data-c="image"]').addEventListener('change', e => {
    tr.querySelector('img.icon').src = '/api/frame/items/' + (Number(e.target.value) || 0);
  });
  return tr;
}
// ── 图标选择弹层 ──
let pickerStart = 0, pickerTarget = null;
const PICK_COUNT = 100, PICK_COLS = 10, PICK_CELL = 48;
function openPicker(imgEl) {
  pickerTarget = imgEl.closest('td').querySelector('input');
  pickerStart = Math.floor((Number(pickerTarget.value) || 0) / PICK_COUNT) * PICK_COUNT;
  refreshPicker();
  document.getElementById('picker').classList.add('on');
}
function refreshPicker() {
  document.getElementById('picker-img').src = `/api/icons?start=${pickerStart}&count=${PICK_COUNT}&_=${pickerStart}`;
  document.getElementById('picker-range').textContent = `帧 ${pickerStart} - ${pickerStart + PICK_COUNT - 1}`;
}
function pickerPage(d) { pickerStart = Math.max(0, pickerStart + d * PICK_COUNT); refreshPicker(); }
function pickIcon(ev) {
  const img = ev.target, r = img.getBoundingClientRect();
  const scale = img.naturalWidth / r.width;
  const col = Math.floor((ev.clientX - r.left) * scale / PICK_CELL);
  const row = Math.floor((ev.clientY - r.top) * scale / PICK_CELL);
  const frame = pickerStart + row * PICK_COLS + col;
  if (pickerTarget) {
    pickerTarget.value = frame;
    pickerTarget.dispatchEvent(new Event('change'));
  }
  document.getElementById('picker').classList.remove('on');
}
function closePicker(ev) { if (ev.target.id === 'picker') ev.target.classList.remove('on'); }
const CLASSES = { warrior: '战士', mage: '法师', taoist: '道士' };
const KTYPES = { damage: '单体伤害', aoe: '范围伤害', heal: '治疗' };
function parseKind(kind) {
  if (kind === 'heal') return { t: 'heal', p1: '', p2: '' };
  if (kind.damage !== undefined) return { t: 'damage', p1: kind.damage, p2: '' };
  if (kind.aoe) return { t: 'aoe', p1: kind.aoe.radius, p2: kind.aoe.mult };
  return { t: 'damage', p1: 1, p2: '' };
}
function skillRow(cls, sk) {
  const k = parseKind(sk.kind ?? { damage: 1 });
  const tr = document.createElement('tr');
  const opt = (obj, sel) => Object.entries(obj).map(([v, t]) =>
    `<option value="${v}" ${v === sel ? 'selected' : ''}>${t}</option>`).join('');
  tr.innerHTML = `
    <td><select data-c="class">${opt(CLASSES, cls)}</select></td>
    <td><input class="wide" data-c="id" value="${sk.id ?? ''}"></td>
    <td><input class="wide" data-c="name" value="${sk.name ?? ''}"></td>
    <td><input data-c="mp" value="${sk.mp ?? 0}"></td>
    <td><input data-c="cd_ms" value="${sk.cd_ms ?? 1000}"></td>
    <td><input data-c="level" value="${sk.level ?? 1}"></td>
    <td><input data-c="range" value="${sk.range ?? 0}"></td>
    <td><input type="checkbox" data-c="self_cast" ${sk.self_cast ? 'checked' : ''}></td>
    <td><select data-c="ktype">${opt(KTYPES, k.t)}</select></td>
    <td><input data-c="p1" value="${k.p1}"></td>
    <td><input data-c="p2" value="${k.p2}"></td>
    <td><button onclick="this.closest('tr').remove()">删</button></td>`;
  const sync = () => {
    const t = tr.querySelector('[data-c=ktype]').value;
    tr.querySelector('[data-c=p1]').disabled = t === 'heal';
    tr.querySelector('[data-c=p2]').disabled = t !== 'aoe';
  };
  tr.querySelector('[data-c=ktype]').addEventListener('change', sync);
  sync();
  return tr;
}
function addSkillRow() {
  document.querySelector('#skill-table tbody').appendChild(
    skillRow('warrior', { id: 'new_skill', name: '新技能', mp: 5, cd_ms: 3000, level: 1, range: 2.5, self_cast: false, kind: { damage: 1.5 } }));
}
function collectSkills() {
  const out = { warrior: [], mage: [], taoist: [] };
  for (const tr of document.querySelectorAll('#skill-table tbody tr')) {
    const v = c => { const el = tr.querySelector(`[data-c=${c}]`); return el.type === 'checkbox' ? el.checked : el.value; };
    const t = v('ktype');
    const kind = t === 'heal' ? 'heal'
      : t === 'aoe' ? { aoe: { radius: Number(v('p1')) || 0, mult: Number(v('p2')) || 0 } }
      : { damage: Number(v('p1')) || 0 };
    out[v('class')].push({
      id: v('id').trim(), name: v('name').trim(),
      mp: Number(v('mp')) || 0, cd_ms: Number(v('cd_ms')) || 0,
      level: Number(v('level')) || 1, range: Number(v('range')) || 0,
      self_cast: v('self_cast'), kind,
    });
  }
  return out;
}
async function loadCfg() {
  const r = await fetch('/api/config', { headers: hdr });
  if (!r.ok) return;
  const d = await r.json();
  const tb = document.querySelector('#item-table tbody');
  tb.innerHTML = '';
  d.items.forEach(it => tb.appendChild(itemRow(it)));
  const sb = document.querySelector('#skill-table tbody');
  sb.innerHTML = '';
  for (const cls of Object.keys(CLASSES))
    (d.skills[cls] || []).forEach(sk => sb.appendChild(skillRow(cls, sk)));
  document.getElementById('quests-json').value = JSON.stringify(d.quests, null, 2);
  document.getElementById('cfg-err').textContent = '';
}
function addItemRow() {
  document.querySelector('#item-table tbody').appendChild(itemRow(
    { template: 'new_item', name: '新物品', slot: 'weapon', attack: 0, defense: 0, hp: 0, image: 0, shape: 0 }));
}
function collectItems() {
  return [...document.querySelectorAll('#item-table tbody tr')].map(tr => {
    const o = {};
    tr.querySelectorAll('input').forEach(inp => {
      const c = inp.dataset.c;
      o[c] = NUM_COLS.has(c) ? Number(inp.value) || 0 : inp.value.trim();
    });
    return o;
  });
}
async function saveCfg(kind) {
  let value;
  try {
    value = kind === 'items' ? collectItems()
          : kind === 'skills' ? collectSkills()
          : JSON.parse(document.getElementById(kind + '-json').value);
  } catch (e) {
    document.getElementById('cfg-err').textContent = 'JSON 语法错误: ' + e.message; return;
  }
  const r = await fetch('/api/config', { method: 'PUT',
    headers: { ...hdr, 'content-type': 'application/json' },
    body: JSON.stringify({ kind, value }) });
  const resp = await r.json();
  document.getElementById('cfg-err').textContent = resp.ok ? '' : resp.errors.join('\n');
  if (resp.ok) flash(kind + ' 已保存并热重载');
}
let zoneData = {};
async function loadZones() {
  const r = await fetch('/api/zones', { headers: hdr });
  if (!r.ok) return;
  const d = await r.json();
  zoneData = Object.fromEntries(d.zones.map(z => [z.map, z]));
  const sel = document.getElementById('zone-sel');
  sel.innerHTML = d.zones.map(z => `<option value="${z.map}">${z.name} [${z.map}]</option>`).join('');
  const avail = document.getElementById('zone-avail');
  avail.innerHTML = d.available.map(m => `<option>${m}</option>`).join('');
  showZone();
}
function showZone() {
  const z = zoneData[document.getElementById('zone-sel').value];
  document.getElementById('zone-json').value = z ? JSON.stringify(z.sidecar, null, 2) : '';
}
async function saveZone() {
  const map = document.getElementById('zone-sel').value;
  let sidecar;
  try { sidecar = JSON.parse(document.getElementById('zone-json').value); }
  catch (e) { document.getElementById('cfg-err').textContent = 'JSON 语法错误: ' + e.message; return; }
  const r = await fetch('/api/zones', { method: 'PUT',
    headers: { ...hdr, 'content-type': 'application/json' },
    body: JSON.stringify({ map, sidecar }) });
  const resp = await r.json();
  document.getElementById('cfg-err').textContent = resp.ok ? '' : resp.error;
  if (resp.ok) { flash(map + ' 已保存并热重载'); loadZones(); }
}
async function addZone() {
  const map = document.getElementById('zone-avail').value;
  if (!map) return;
  const r = await fetch('/api/zones', { method: 'POST',
    headers: { ...hdr, 'content-type': 'application/json' },
    body: JSON.stringify({ map }) });
  const resp = await r.json();
  document.getElementById('cfg-err').textContent = resp.ok ? '' : resp.error;
  if (resp.ok) { flash(map + ' 已接入 (记得配置客户端小地图帧号与传送门)'); loadZones(); }
}
if (location.hash === '#config') showTab('config');
tick(); setInterval(tick, 2000);
</script>
</body>
</html>
