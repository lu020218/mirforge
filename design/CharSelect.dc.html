<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    a { color: #c9a55c; } a:hover { color: #ffd876; }
  </style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: radial-gradient(1100px 700px at 62% 40%, #14172a 0%, #0c0e18 60%, #0a0a12 100%)">
  <div style="position: absolute; inset: 0; background: radial-gradient(1400px 900px at 50% 50%, rgba(0,0,0,0) 60%, rgba(0,0,0,0.5) 100%); pointer-events: none"></div>

  <!-- 顶部 -->
  <div style="position: absolute; top: 40px; left: 64px; right: 64px; display: flex; justify-content: space-between; align-items: center">
    <div style="font-family: 'Noto Serif SC', serif; font-weight: 600; font-size: 24px; letter-spacing: 8px; color: #e8e2d0">选择角色</div>
    <div style="font-size: 13px; color: #9a917c">玛法一区 · <span style="color: #c9a55c">okami</span></div>
  </div>

  <!-- 左: 角色列表 -->
  <div style="position: absolute; left: 64px; top: 120px; width: 380px; display: flex; flex-direction: column; gap: 16px">
    <!-- 选中卡 -->
    <div style="display: flex; align-items: center; gap: 16px; padding: 18px; background: rgba(201,165,92,0.07); border: 1px solid #c9a55c; border-radius: 4px; box-shadow: 0 0 30px rgba(201,165,92,0.12)">
      <div style="width: 64px; height: 64px; border-radius: 50%; border: 2px solid #c9a55c; background: radial-gradient(circle at 35% 30%, #2a2c40, #12131e); display: flex; align-items: center; justify-content: center">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ffd876" stroke-width="1.6"><path d="M12 3 L12 15 M8 7 L16 7 M9 15 L15 15 L14 21 L10 21 Z"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1">
        <div style="display: flex; align-items: baseline; gap: 10px">
          <span style="font-size: 18px; font-weight: 700; color: #e8e2d0">玄夜</span>
          <span style="font-size: 12px; color: #ffd876; border: 1px solid #6b5a32; border-radius: 9px; padding: 1px 8px">Lv 32</span>
        </div>
        <div style="font-size: 12px; color: #9a917c">战士 · 男 · 比奇省</div>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c9a55c" stroke-width="2"><path d="M9 6 L15 12 L9 18"></path></svg>
    </div>
    <!-- 其他卡 -->
    <div style="display: flex; align-items: center; gap: 16px; padding: 18px; background: rgba(13,15,24,0.7); border: 1px solid #2a2d3c; border-radius: 4px">
      <div style="width: 64px; height: 64px; border-radius: 50%; border: 2px solid #3a3d50; background: radial-gradient(circle at 35% 30%, #232538, #101120); display: flex; align-items: center; justify-content: center">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#9a917c" stroke-width="1.6"><circle cx="12" cy="7" r="3"></circle><path d="M12 10 L12 21 M12 13 L7 18 M12 13 L17 18"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1">
        <div style="display: flex; align-items: baseline; gap: 10px">
          <span style="font-size: 18px; font-weight: 700; color: #cfc8b4">璃月</span>
          <span style="font-size: 12px; color: #9a917c; border: 1px solid #2a2d3c; border-radius: 9px; padding: 1px 8px">Lv 18</span>
        </div>
        <div style="font-size: 12px; color: #9a917c">法师 · 女 · 盟重省</div>
      </div>
    </div>
    <!-- 空位 -->
    <div style="display: flex; align-items: center; justify-content: center; gap: 10px; padding: 24px; background: rgba(13,15,24,0.4); border: 1px dashed #3a3d50; border-radius: 4px; color: #9a917c; font-size: 14px; letter-spacing: 2px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a917c" stroke-width="2"><path d="M12 5 L12 19 M5 12 L19 12"></path></svg>
      创建新角色
    </div>
  </div>

  <!-- 中: 角色展示台 -->
  <div style="position: absolute; left: 444px; right: 0; top: 190px; height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end">
    <!-- 立绘占位剪影 -->
    <div style="width: 300px; height: 480px; background: linear-gradient(180deg, rgba(58,61,80,0.9) 0%, rgba(30,32,48,0.95) 100%); clip-path: polygon(50% 0%, 66% 10%, 72% 30%, 88% 46%, 74% 52%, 78% 96%, 22% 96%, 26% 52%, 12% 46%, 28% 30%, 34% 10%); box-shadow: 0 0 80px rgba(201,165,92,0.1)"></div>
    <!-- 台座光环 -->
    <div style="width: 420px; height: 90px; margin-top: -40px; border-radius: 50%; background: radial-gradient(closest-side, rgba(201,165,92,0.35), rgba(201,165,92,0.08) 60%, rgba(0,0,0,0)); border: 1px solid rgba(201,165,92,0.25)"></div>
    <div style="margin-top: 18px; display: flex; flex-direction: column; align-items: center; gap: 6px">
      <div style="font-family: 'Noto Serif SC', serif; font-size: 30px; font-weight: 600; letter-spacing: 6px; color: #e8e2d0">玄 夜</div>
      <div style="font-size: 13px; color: #9a917c">战士 · Lv 32 · 攻击 128-156 · 防御 87</div>
    </div>
  </div>

  <!-- 底部操作 -->
  <div style="position: absolute; left: 444px; right: 0; bottom: 56px; display: flex; justify-content: center; gap: 20px">
    <div style="width: 260px; height: 54px; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, #4a3c22, #241d10); border: 1px solid #6b5a32; border-radius: 3px; color: #ffd876; font-size: 16px; font-weight: 700; letter-spacing: 8px; text-indent: 8px; box-shadow: 0 0 24px rgba(201,165,92,0.18)">进 入 游 戏</div>
    <div style="width: 140px; height: 54px; display: flex; align-items: center; justify-content: center; border: 1px solid #2a2d3c; border-radius: 3px; color: #9a917c; font-size: 14px; letter-spacing: 4px">删除角色</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
